openapi: 3.1.0
info:
  title: Projector Grid Web API
  version: 0.2.0
  description: |
    Served by the Projector Grid app on the port set in Preferences → Web Access.
    Every route except `/api/login` and `/api/session` needs a session: the
    `pg_session` cookie (browsers) or `Authorization: Bearer <token>` (scripts).

    The source of truth for the shapes below. The Dart side writes sample
    payloads to `test/fixtures/api/*.json`; `tests/contract.test.ts` validates
    them against these schemas.
servers:
  - url: /

components:
  responses:
    Unauthorized:
      description: No session, or it expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: pg_session
    bearer:
      type: http
      scheme: bearer

  schemas:
    Role:
      type: string
      enum: [viewer, operator]

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_request, invalid_pin, locked_out, unauthorized, forbidden, not_found]
        retryAfter:
          type: integer
          description: Seconds until the IP may try again (`locked_out` only).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string

    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, role, controlAllowed]
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        controlAllowed:
          type: boolean

    Session:
      type: object
      additionalProperties: false
      required: [projectName, authenticated, controlAllowed]
      properties:
        projectName:
          type: string
        authenticated:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        controlAllowed:
          type: boolean
          description: '*Allow control* is on: operator PIN login and *Unlock control* work.'

    Access:
      type: object
      additionalProperties: false
      required: [role, controlAllowed]
      description: This session's role, and whether *Unlock control* is available.
      properties:
        role:
          $ref: '#/components/schemas/Role'
        controlAllowed:
          type: boolean

    Projector:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - ip
        - groupId
        - x
        - y
        - connection
        - power
        - shutter
        - serial
        - input
        - signal
        - testPattern
        - runtime
        - lightRuntime
        - intakeTemp
        - exhaustTemp
        - acVoltage
        - errors
        - errorItems
      description: |
        Display strings are exactly what the app shows ('-' = not polled yet).
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        groupId:
          type: [string, 'null']
        x:
          type: number
          description: Card position on the app's canvas (px).
        y:
          type: number
        connection:
          type: string
          enum: [connected, offline, unauthorized, unprotected]
        power:
          type: string
          enum: [standby, turningOn, on, cooling]
        shutter:
          type: string
          enum: [open, closed]
        serial:
          type: string
        input:
          type: string
        signal:
          type: string
        testPattern:
          type: [string, 'null']
          description: '`OTS:xx` command of the active pattern, `OTS:00` = off, null = not polled.'
        runtime:
          type: string
        lightRuntime:
          type: string
        intakeTemp:
          type: string
        exhaustTemp:
          type: string
        acVoltage:
          type: string
        errors:
          type: string
          description: "'NO ERRORS', '-' or the projector's error code."
        errorItems:
          type: array
          description: "`errors` decoded by the app's code table, in reply order; empty when healthy."
          items:
            $ref: '#/components/schemas/ErrorItem'

    ErrorItem:
      type: object
      additionalProperties: false
      required: [code, name, severity]
      properties:
        code:
          type: string
          description: '`F305`, or the whole reply when it holds no code.'
        name:
          type: [string, 'null']
          description: From the code table; null for a code it doesn't know.
        severity:
          $ref: '#/components/schemas/AlertSeverity'

    AlertSeverity:
      type: string
      enum: [warning, critical]

    Projectors:
      type: array
      description: In layout order (left→right, top→bottom).
      items:
        $ref: '#/components/schemas/Projector'

    Group:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-F]{6}$'

    Groups:
      type: array
      items:
        $ref: '#/components/schemas/Group'

    TempThreshold:
      type: object
      additionalProperties: false
      required: [warm, hot]
      properties:
        warm:
          type: number
        hot:
          type: number

    ColumnId:
      type: string
      enum:
        - connection
        - model
        - serial
        - preview
        - group
        - ip
        - power
        - shutter
        - input
        - signal
        - testPattern
        - runtime
        - lightRuntime
        - intake
        - exhaust
        - voltage
        - errors

    Density:
      type: string
      enum: [compact, standard, comfortable]

    TableLayout:
      type: object
      additionalProperties: false
      required: [columns, widths, sortColumn, sortAscending, density, fitToWidth, groupBy]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnId'
        widths:
          type: object
          additionalProperties:
            type: number
        sortColumn:
          $ref: '#/components/schemas/ColumnId'
        sortAscending:
          type: boolean
        density:
          $ref: '#/components/schemas/Density'
        fitToWidth:
          type: boolean
        groupBy:
          type: boolean

    Config:
      type: object
      additionalProperties: false
      required:
        - projectName
        - role
        - columns
        - defaultColumns
        - presets
        - minColumnWidth
        - layout
        - thresholds
        - testPatterns
        - inputs
        - lensCalibrations
        - lensTypes
        - alignmentPresets
      properties:
        projectName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        columns:
          type: array
          description: Every Monitoring column, in canonical order.
          items:
            type: object
            additionalProperties: false
            required: [id, label, defaultWidth]
            properties:
              id:
                $ref: '#/components/schemas/ColumnId'
              label:
                type: string
              defaultWidth:
                type: number
        defaultColumns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnId'
        presets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, columns]
            properties:
              name:
                type: string
              columns:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnId'
        minColumnWidth:
          type: number
        layout:
          $ref: '#/components/schemas/TableLayout'
        thresholds:
          type: object
          additionalProperties: false
          required: [intake, exhaust]
          properties:
            intake:
              $ref: '#/components/schemas/TempThreshold'
            exhaust:
              $ref: '#/components/schemas/TempThreshold'
        testPatterns:
          $ref: '#/components/schemas/Options'
        inputs:
          $ref: '#/components/schemas/Options'
        lensCalibrations:
          $ref: '#/components/schemas/Options'
        lensTypes:
          $ref: '#/components/schemas/Options'
        alignmentPresets:
          type: array
          description: Alignment mode's tasks and the patterns each one offers (Custom = all).
          items:
            type: object
            additionalProperties: false
            required: [id, label, patterns]
            properties:
              id:
                $ref: '#/components/schemas/AlignmentPresetId'
              label:
                type: string
              patterns:
                type: array
                items:
                  type: string

    AlignmentPresetId:
      type: string
      enum: [geometry, color, custom]

    AlignmentRole:
      type: string
      description: |
        `focused` — shutter open, Focused pattern; `shown` — open with the Others
        pattern (a neighbour, or everyone under Show All); `closed` — shutter closed.
      enum: [focused, shown, closed]

    Alignment:
      type: object
      additionalProperties: false
      required:
        - active
        - busy
        - focusedId
        - roles
        - preset
        - focusedPattern
        - othersPattern
        - showNeighbours
        - includeDiagonals
        - showAll
      description: |
        The app's Alignment mode — one shared session, driven from the app or any page.
        Preset, patterns and the neighbour options persist while the mode is off.
      properties:
        active:
          type: boolean
        busy:
          type: boolean
          description: Entry (reading projectors) or exit (restoring them) in progress.
        focusedId:
          type: [string, 'null']
        roles:
          type: object
          description: The mode's scope, projector id → role; empty while off.
          additionalProperties:
            $ref: '#/components/schemas/AlignmentRole'
        preset:
          $ref: '#/components/schemas/AlignmentPresetId'
        focusedPattern:
          type: string
        othersPattern:
          type: [string, 'null']
          description: null = same as focused.
        showNeighbours:
          type: boolean
        includeDiagonals:
          type: boolean
        showAll:
          type: boolean

    Options:
      type: array
      description: The app's choices for a control, in its order; `code` is what an action sends.
      items:
        type: object
        additionalProperties: false
        required: [code, label]
        properties:
          code:
            type: string
          label:
            type: string

    Alerts:
      type: object
      additionalProperties: false
      required: [now, alerts]
      description: The app's active alerts and its clock.
      properties:
        now:
          type: string
          format: date-time
          description: The app's time (UTC); the page measures durations against it, not its own clock.
        alerts:
          type: array
          description: In the app's display order (unacknowledged, problems before returned signals, critical, newest).
          items:
            $ref: '#/components/schemas/Alert'

    Alert:
      type: object
      additionalProperties: false
      required:
        - id
        - projectorId
        - projector
        - ip
        - rule
        - label
        - item
        - severity
        - value
        - since
        - acknowledged
        - restoredAt
      properties:
        id:
          type: string
          description: Stable while the alert lasts; what `ids` in an acknowledge request takes.
        projectorId:
          type: string
        projector:
          type: string
          description: The projector's name ('' once it was deleted).
        ip:
          type: string
        rule:
          $ref: '#/components/schemas/AlertRule'
        label:
          type: string
          description: The rule's name, e.g. "Signal lost".
        item:
          type: string
          description: The error code for `error`; '' for the other rules.
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        value:
          type: string
          description: What the app shows large, e.g. "58 °C", "No signal on HDMI 1", "Back after 3 s".
        since:
          type: string
          format: date-time
        acknowledged:
          type: boolean
        restoredAt:
          type: [string, 'null']
          format: date-time
          description: A Signal lost whose signal came back; it stays until acknowledged.

    AlertRule:
      type: string
      enum: [offline, error, signal-lost, intake-temp, exhaust-temp]

    AcknowledgeRequest:
      description: Exactly one way to name the alerts.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              items:
                type: string
        - type: object
          additionalProperties: false
          required: [projectorId]
          properties:
            projectorId:
              type: string
        - type: object
          additionalProperties: false
          required: [rule]
          properties:
            rule:
              $ref: '#/components/schemas/AlertRule'
        - type: object
          additionalProperties: false
          required: [all]
          properties:
            all:
              const: true

    AcknowledgeResult:
      type: object
      additionalProperties: false
      required: [acknowledged]
      properties:
        acknowledged:
          type: integer
          description: How many were unacknowledged and now are.

    RefreshResult:
      type: object
      additionalProperties: false
      required: [polled]
      properties:
        polled:
          type: boolean
          description: False when a poll cycle was already running and the request waited for it.

    SnapshotEvent:
      type: object
      additionalProperties: false
      required: [projectName, projectors, groups]
      properties:
        projectName:
          type: string
        projectors:
          $ref: '#/components/schemas/Projectors'
        groups:
          $ref: '#/components/schemas/Groups'

    ProjectEvent:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string

    Targets:
      description: Explicit projector ids, one group, or every projector.
      oneOf:
        - type: array
          minItems: 1
          items:
            type: string
        - type: object
          additionalProperties: false
          required: [group]
          properties:
            group:
              type: string
        - type: string
          const: all

    LensAxis:
      type: string
      enum: [shiftH, shiftV, focus, zoom]

    Action:
      description: |
        The fixed vocabulary the server maps to NTCONTROL (`web_actions.dart`).
        Lens `dir`: `+` = right / up / far / in.
      oneOf:
        - type: object
          additionalProperties: false
          required: [power]
          properties:
            power:
              type: string
              enum: ['on', 'off']
        - type: object
          additionalProperties: false
          required: [shutter]
          properties:
            shutter:
              type: string
              enum: [open, close]
        - type: object
          additionalProperties: false
          required: [testPattern]
          properties:
            testPattern:
              type: string
              description: An `OTS:xx` code from `Config.testPatterns`, or `OTS:00` for off.
        - type: object
          additionalProperties: false
          required: [osd]
          properties:
            osd:
              type: string
              enum: ['on', 'off']
        - type: object
          additionalProperties: false
          required: [input]
          properties:
            input:
              type: string
              description: A code from `Config.inputs`.
        - type: object
          additionalProperties: false
          required: [lensCalibration]
          properties:
            lensCalibration:
              type: string
              description: A code from `Config.lensCalibrations`.
        - type: object
          additionalProperties: false
          required: [lensType]
          properties:
            lensType:
              type: string
              description: A code from `Config.lensTypes`.
        - type: object
          additionalProperties: false
          required: [lens]
          properties:
            lens:
              type: string
              const: home
        - type: object
          additionalProperties: false
          required: [lens, dir, speed]
          properties:
            lens:
              $ref: '#/components/schemas/LensAxis'
            dir:
              type: string
              enum: ['+', '-']
            speed:
              type: string
              enum: [slow, normal, fast]

    ActionRequest:
      type: object
      additionalProperties: false
      required: [targets, action]
      properties:
        targets:
          $ref: '#/components/schemas/Targets'
        action:
          $ref: '#/components/schemas/Action'

    ProjectorRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DispatchResult:
      type: object
      additionalProperties: false
      required: [command, label, ok, total, failed, skipped, summary]
      properties:
        command:
          type: string
        label:
          type: string
          description: Readable command name, e.g. "Shutter Close".
        ok:
          type: integer
        total:
          type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/ProjectorRef'
        skipped:
          type: array
          description: Not connected (offline / auth error) — never sent.
          items:
            $ref: '#/components/schemas/ProjectorRef'
        summary:
          type: string
          description: The Event Log's line, e.g. "Shutter Close — 4/4 OK".

    SignedOutEvent:
      type: object
      additionalProperties: false

    PreviewStatus:
      type: object
      additionalProperties: false
      required: [state, notice, overlay, signal, preShow, preShowApplying]
      properties:
        state:
          type: string
          enum: [connecting, live, notice, unavailable]
          description: |
            `live` = images are coming (`frame` events); `notice` = the feed is up but the
            projector reports a status instead of an image; `unavailable` = no feed (offer
            *Retry*).
        notice:
          description: Set with `state` `notice`; `blank` shows nothing.
          oneOf:
            - type: string
              enum: [noSignal, hdcp, startingUp, rotating, blank]
            - type: 'null'
        overlay:
          description: A tag over a live image.
          oneOf:
            - type: string
              enum: [testPattern, aspectMismatch]
            - type: 'null'
        signal:
          description: The input and signal tag, e.g. "HDMI1 · 1080/60p"; null while unknown.
          type: [string, 'null']
        preShow:
          description: Whether pre-show is on; null until read (only read in Standby).
          type: [boolean, 'null']
        preShowApplying:
          type: boolean
          description: A change was sent and the projector hasn't confirmed it yet.

    PreviewFrame:
      type: object
      additionalProperties: false
      required: [jpeg]
      properties:
        jpeg:
          type: string
          description: The image, base64.

    PreShowRequest:
      type: object
      additionalProperties: false
      required: ['on']
      properties:
        'on':
          type: boolean

security:
  - cookie: []
  - bearer: []

paths:
  /api/login:
    post:
      security: []
      summary: Sign in with a PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Also sets the `pg_session` HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 'Body isn''t `{"pin": "<string>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong PIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many wrong PINs from this IP; see `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/logout:
    post:
      summary: End this session
      responses:
        '204':
          description: Signed out; the cookie is cleared.

  /api/unlock:
    post:
      summary: Unlock control — upgrade this session to operator with the Operator PIN
      description: Only exists while *Allow control* is on (404 otherwise). Wrong PINs count towards the same per-IP lockout as logins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Now operator. The session's other tabs get an `access` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
        '400':
          description: 'Body isn''t `{"pin": "<string>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong PIN, or no session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many wrong PINs from this IP; see `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/lock:
    post:
      summary: Lock — back to viewer, same session
      description: Only exists while *Allow control* is on (404 otherwise).
      responses:
        '200':
          description: Now viewer. The session's other tabs get an `access` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/actions:
    post:
      summary: Send an action to projectors (operator only)
      description: |
        Only exists while *Allow control* is on (404 otherwise). A viewer session gets 403.
        Lens steps to a projector whose previous step is still in flight are dropped.
        Logged in the app's Event Log with the source ("Web · <ip> · operator").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Sent; per-projector outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResult'
        '400':
          description: Not a valid action request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Viewer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/alignment:
    get:
      summary: Alignment mode's state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alignment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/alignment/{op}:
    post:
      summary: Drive Alignment mode (operator only)
      description: |
        Only exists while *Allow control* is on (404 otherwise). A viewer session gets 403.
        Each op calls the app's own Alignment mode, so the app's banner follows.

        | `op` | Body | Does |
        |---|---|---|
        | `enter` | none, or `{"targets": [ids]}` — the page's selection | scope = the selection when it has 2+ projectors, else all; waits while projectors are read |
        | `exit` | none | restores shutters, patterns and shutter fades; waits until done |
        | `next` / `prev` | none | step in layout order, wrapping |
        | `focus` | `{"id": "…"}` | focus one projector in the scope |
        | `neighbours` / `diagonals` / `showAll` | none | flip the toggle |
        | `preset` | `{"preset": "geometry" \| "color" \| "custom"}` | switch the task (its default patterns, Custom keeps them) |
        | `focusedPattern` | `{"code": "OTS:xx"}` | a pattern the current preset offers |
        | `othersPattern` | `{"code": "OTS:xx" \| null}` | null = same as focused |
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
            enum:
              - enter
              - exit
              - next
              - prev
              - focus
              - neighbours
              - diagonals
              - showAll
              - preset
              - focusedPattern
              - othersPattern
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Done; the new state (every page also gets an `alignment` event).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alignment'
        '400':
          description: Unknown op, or a body it doesn't take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Viewer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/session:
    get:
      security: []
      summary: Project name, and whether this client is signed in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /api/config:
    get:
      summary: Column catalogue, presets, the app's table layout, thresholds, test patterns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projectors:
    get:
      summary: All projectors with telemetry, in layout order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projectors'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projectors/{id}:
    get:
      summary: One projector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projector'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such projector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/groups:
    get:
      summary: Groups (empty → the page shows one flat list)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/alerts:
    get:
      summary: Active alerts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerts'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/alerts/acknowledge:
    post:
      summary: Acknowledge alerts (operator only)
      description: |
        Only exists while *Allow control* is on (404 otherwise). A viewer session gets 403.
        Same as in the app: OSC `/pgrid/alert/acknowledged`, a returned signal clears, and the
        Event Log names the source ("Signal lost acknowledged (Web · <ip> · operator)").
        Every page gets an `alerts` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeResult'
        '400':
          description: Not a valid acknowledge request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Viewer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/refresh:
    post:
      summary: Poll every projector now (operator only)
      description: |
        Only exists while *Allow control* is on (404 otherwise). A viewer session gets 403.
        The app's F5: one poll cycle over every projector, logged in the Event Log with the web
        source. Replies when the cycle has finished; the new values reach the pages as the usual
        `projector` events. No body.
      responses:
        '200':
          description: The cycle finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Viewer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/events:
    get:
      summary: Live updates (Server-Sent Events)
      description: |
        `text/event-stream`; a `: ping` comment every 15 s. Events (`event:` name → `data:` JSON):

        | Event | Data | When |
        |---|---|---|
        | `snapshot` | `SnapshotEvent` | first, on every (re)connect |
        | `projectors` | `Projectors` | projectors added, removed or reordered |
        | `projector` | `Projector` | one projector changed |
        | `groups` | `Groups` | groups changed |
        | `project` | `ProjectEvent` | another project was opened or saved under a new name |
        | `alignment` | `Alignment` | after `snapshot`, and whenever Alignment mode changes (from the app or any page) |
        | `alerts` | `Alerts` | after `alignment`, and whenever an alert is raised, changes, clears or is acknowledged |
        | `access` | `Access` | this session was unlocked / locked (in another tab too), or *Allow control* was switched |
        | `signedOut` | `SignedOutEvent` | the session ended (PIN changed, *Sign out all clients*, Web Access off); the stream then closes |
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/preview/{id}:
    get:
      summary: One projector's Remote Preview (Server-Sent Events)
      description: |
        The app relays the projector's own preview feed (~1 fps JPEG): every page and the
        app's preview dialog share one feed per projector, opened by the first watcher and
        closed a few seconds after the last one leaves. Viewers can watch too.
        `text/event-stream`; a `: ping` comment every 15 s. Events:

        | Event | Data | When |
        |---|---|---|
        | `status` | `PreviewStatus` | first, and whenever it changes |
        | `frame` | `PreviewFrame` | after `status` when an image is up, then each new image |
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such projector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/preview/{id}/retry:
    post:
      summary: Reconnect the preview feed (the window's *Retry*)
      description: Any signed-in page; only while a page watches this projector.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reconnecting; the stream reports the outcome.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such projector, or nobody watches it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/preview/{id}/preshow:
    post:
      summary: Switch pre-show (operator only)
      description: |
        Only exists while *Allow control* is on (404 otherwise); a viewer session gets 403.
        Only in Standby with the feed up (`status` `live` or `notice`) and a page watching,
        as in the app; the stream's `preShow` / `preShowApplying` follow.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreShowRequest'
      responses:
        '200':
          description: Sent; the projector confirms it in a few seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreShowRequest'
        '400':
          description: A bad body, or the projector can't take it now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Viewer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '*Allow control* is off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
