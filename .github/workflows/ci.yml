name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Only lib/ and test/ are held to format/lint rules; tool/ holds manual
      # scripts (see CLAUDE.md).
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test --coverage

  # The Web UI (web_ui/): its own toolchain, so its own job. The contract test
  # reads the golden fixtures the Flutter tests write, from test/fixtures/api/.
  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # types.gen.ts is committed; a contract change without `npm run gen:api` fails here.
      - name: Check API types are generated
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/types.gen.ts

      - name: Type check
        run: npm run check

      - name: Lint and formatting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
